<body>
  <main class="py-5 bg-light-subtle min-vh-100 d-flex align-items-center">
    <div class="container">
      <a id="backButton" href="index.html" class="btn btn-outline-secondary btn-sm mb-4"><i class="fa-solid fa-arrow-left me-2"></i>Geri Dön</a>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="p-4 p-lg-5 bg-white rounded-4 shadow-sm h-100">
            <h1 class="fw-bold mb-3 h2">İletişim ve Teklif Formu</h1>
            <p class="text-muted mb-4">Formu doldurun, ekibimiz en kısa sürede sizinle iletişime geçsin.</p>
            <form id="offerForm" novalidate>
              <div class="mb-3">
                <label for="fullName" class="form-label fw-medium">İsim Soyisim</label>
                <input id="fullName" name="fullName" type="text" class="form-control form-control-lg" placeholder="Adınız Soyadınız" required>
              </div>
              <div class="mb-3">
                <label for="product" class="form-label fw-medium">İlgilenilen Ürün</label>
                <select id="product" name="product" class="form-select form-select-lg" required>
                  <option value="">Seçiniz</option>
                  <option value="trafik">Trafik Sigortası</option>
                  <option value="kasko">Kasko Sigortası</option>
                  <option value="imm">İhtiyari Mali Mesuliyet (İMM)</option>
                  <option value="koltuk-ferdi-kaza">Koltuk Ferdi Kaza Sigortası</option>
                  <option value="asistans">Asistans Hizmeti</option>
                  <option value="tamamlayici-saglik">Tamamlayıcı Sağlık</option>
                  <option value="dask">DASK</option>
                  <option value="konut">Konut Sigortası</option>
                  <option value="isyeri">İş Yeri Sigortası</option>
                  <option value="seyahat">Seyahat Sigortası</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label fw-medium">Telefon Numarası</label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text phone-prefix">+90</span>
                  <input id="phone" name="phone" type="tel" class="form-control" placeholder="5XX XXX XX XX" inputmode="numeric" maxlength="13" autocomplete="tel-national" required>
                </div>
                <div class="form-text">10 haneli cep telefonu numarası giriniz (5XX XXX XX XX).</div>
              </div>
              <div class="mb-4">
                <label for="note" class="form-label fw-medium">Not</label>
                <textarea id="note" name="note" class="form-control" rows="4" placeholder="Talebinizi kısaca yazabilirsiniz..."></textarea>
              </div>
              <button id="submitBtn" type="submit" class="btn btn-danger btn-lg px-4">
                <span class="submit-label">Gönder</span>
                <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
              </button>
            </form>
          </div>
        </div>
        <div class="col-md-6">
          <div class="p-4 p-lg-5 bg-white rounded-4 shadow-sm h-100">
            <h5 class="fw-semibold mb-3">İletişim Bilgileri</h5>
            <p class="mb-2"><i class="fa-solid fa-envelope me-2"></i>info@mayadalisigorta.com.tr</p>
            <p class="mb-2"><i class="fa-solid fa-phone me-2"></i>+90 535 308 68 74</p>
            <p class="mb-0"><i class="fa-solid fa-location-dot me-2"></i>Hatay/Merkez</p>
            <div class="d-flex gap-2 mt-3">
              <a class="btn btn-outline-primary btn-sm rounded-pill" href="https://www.facebook.com/sigortamayadali/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook-f me-1"></i>Facebook</a>
              <a class="btn btn-outline-danger btn-sm rounded-pill" href="https://www.instagram.com/mayadalisigorta" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram me-1"></i>Instagram</a>
            </div>
            <hr>
            <img src="kaynak/Kurumsal.jpeg" alt="Mayadalı Sigorta Kurumsal" class="img-fluid rounded-4 shadow-sm mt-2">
          </div>
        </div>
      </div>
    </div>
  </main>
